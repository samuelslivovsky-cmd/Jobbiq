# Local development only — production runs on Vercel (Neon/Vercel Postgres,
# Vercel Cron, Vercel Blob).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobbiq
      POSTGRES_PASSWORD: jobbiq
      POSTGRES_DB: jobbiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
